<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10130e"><title>Tank Duel</title><link rel="stylesheet" href="style.css"></head>
<body><main><canvas id="game" width="960" height="600" aria-label="Two player Tank Duel arena"></canvas>
<header id="hud" class="hidden"><div class="p1"><small>PLAYER 1</small><b id="p1score">0</b></div><div><small>ROUND</small><b id="round">1</b></div><div class="p2"><small id="p2label">AI TANK</small><b id="p2score">0</b></div></header><button id="pauseBtn" class="pause hidden" aria-label="Pause">Ⅱ</button>
<section id="menu" class="panel"><div class="kicker">SILVER ARCADE // LOCAL VERSUS</div><h1>TANK<br><span>DUEL</span></h1><p>Ricochet. Outthink. First to five wins.</p><div class="modes" aria-label="Choose player count"><button class="mode selected" data-players="1">1 PLAYER<small>VERSUS AI</small></button><button class="mode" data-players="2">2 PLAYERS<small>LOCAL DUEL</small></button></div><div class="control-grid"><div><b>PLAYER 1</b><span>W/S MOVE · A/D TURN<br>SPACE FIRE</span></div><div><b id="opponentLabel">AI OPPONENT</b><span id="opponentKeys">AUTOMATIC MAZE COMBAT</span></div></div><button id="start">START MATCH</button></section>
<section id="paused" class="panel compact hidden"><div class="kicker">CEASE FIRE</div><h2>PAUSED</h2><button id="resume">RESUME</button><button id="restartPause" class="secondary">RESTART MATCH</button></section>
<section id="winner" class="panel hidden"><div class="kicker">MATCH COMPLETE</div><h2 id="winnerTitle">PLAYER 1 WINS</h2><p id="winnerScore">5 — 0</p><button id="restart">REMATCH</button><a href="../../">BACK TO ARCADE</a></section>
<div id="countdown" aria-live="polite"></div><div id="roundFlash"></div>
<script src="core.js?v=1.1.0"></script><script src="game.js?v=1.1.0"></script></main></body></html>
