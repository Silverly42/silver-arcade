  <title>Silver Arcade</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#f5f7ff;background:radial-gradient(circle at 15% 10%,#213467 0,transparent 34%),#080a13}.wrap{max-width:1100px;margin:auto;padding:64px 24px}.eyebrow{color:#66f7d4;text-transform:uppercase;letter-spacing:.18em;font-weight:800}.title{font-size:clamp(3rem,9vw,7rem);margin:.1em 0;line-height:.9}.lead{max-width:620px;color:#afb6d4;font-size:1.2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin-top:48px}.card{display:block;padding:28px;min-height:240px;border:1px solid #303752;border-radius:24px;text-decoration:none;color:inherit;background:linear-gradient(145deg,#151a30cc,#0c0f1dcc);transition:.2s}.card:hover{transform:translateY(-5px);border-color:#66f7d4;box-shadow:0 18px 60px #0008}.orb{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#66f7d4 20%,#3f5fe5 65%,#111936);box-shadow:0 0 38px #66f7d488}.play{display:inline-block;margin-top:18px;color:#66f7d4;font-weight:800}.foot{margin-top:70px;color:#747c9d;font-size:.9rem}

</head>
<body><main class="wrap"><div class="eyebrow">Silver Arcade</div><h1 class="title">Pick up.<br>Play now.</h1><p class="lead">Fast browser games made for desktop and mobile. No installs, no waiting.</p><section class="grid"><a class="card" href="games/slider-io/"><div class="orb"></div><h2>Slider.io</h2><p>Feed, grow, boost, and outmanoeuvre a living arena of neon rivals.</p><span class="play">Play now →</span></a></section><p class="foot">More games incoming.</p></main></body>
